services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: selfalone
      POSTGRES_USER: selfalone
      POSTGRES_PASSWORD: selfalone
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfalone -d selfalone"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - selfalone-postgres:/var/lib/postgresql/data

volumes:
  selfalone-postgres:
