<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>老己移动端对话主画面探索稿</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <style>
      :root {
        color-scheme: light;
        --app-paper: #f8faf6;
        --paper: #fffefa;
        --paper-soft: #f1f5f0;
        --celadon-wash: #dce9e2;
        --celadon-selected: #d5e7df;
        --ink: #1d2c28;
        --ink-soft: #62716c;
        --ink-faint: #87938f;
        --line: #d4ded9;
        --line-strong: #b7c9c1;
        --pine: #174e40;
        --jade: #0b705b;
        --jade-pressed: #095e4d;
        --focus: #0b705b;
        font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #e1e9e4;
        color: var(--ink);
      }

      button,
      textarea { font: inherit; }
      button { color: inherit; }

      .stage {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }

      .phone-screen {
        position: relative;
        width: min(430px, 100vw);
        height: min(932px, 100dvh);
        min-height: 640px;
        overflow: hidden;
        background:
          linear-gradient(rgba(248, 250, 246, 0.97), rgba(248, 250, 246, 0.97)),
          repeating-linear-gradient(92deg, rgba(23, 78, 64, 0.018) 0, rgba(23, 78, 64, 0.018) 1px, transparent 1px, transparent 5px);
        isolation: isolate;
      }

      @media (min-width: 520px) and (min-height: 900px) {
        .phone-screen {
          border: 1px solid rgba(23, 78, 64, 0.12);
          border-radius: 28px;
          box-shadow: 0 20px 56px rgba(29, 44, 40, 0.14);
        }
      }

      .app-header {
        position: absolute;
        z-index: 6;
        inset: 0 0 auto;
        height: calc(64px + env(safe-area-inset-top));
        padding: calc(10px + env(safe-area-inset-top)) 12px;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        background: rgba(248, 250, 246, 0.92);
        border-bottom: 1px solid rgba(212, 222, 217, 0.72);
        backdrop-filter: blur(16px);
      }

      .icon-button {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .icon-button i { font-size: 23px; line-height: 1; }

      .icon-button:active,
      .icon-button[aria-expanded="true"] {
        background: var(--celadon-wash);
        transform: scale(0.96);
      }

      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

      .conversation-title { min-width: 0; text-align: center; }

      .conversation-title strong {
        display: block;
        overflow: hidden;
        color: var(--pine);
        font-family: "Songti SC", "STSong", serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
        letter-spacing: 0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-spacer { width: 44px; height: 44px; }

      .conversation {
        position: absolute;
        inset: calc(64px + env(safe-area-inset-top)) 0 calc(155px + env(safe-area-inset-bottom));
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 18px 16px 86px;
        scrollbar-width: none;
      }

      .conversation::-webkit-scrollbar,
      .drawer-main::-webkit-scrollbar { display: none; }

      .date-label {
        margin: 0 0 18px;
        color: var(--ink-faint);
        font-size: 11px;
        line-height: 16px;
        text-align: center;
      }

      .message { display: flex; gap: 10px; align-items: flex-start; }
      .message + .message { margin-top: 26px; }
      .message.user { justify-content: flex-end; }

      .avatar {
        flex: 0 0 auto;
        width: 34px;
        height: 34px;
        border: 1px solid rgba(23, 78, 64, 0.16);
        border-radius: 50%;
        object-fit: cover;
      }

      .message-body { min-width: 0; max-width: min(296px, calc(100vw - 66px)); }

      .user-bubble {
        max-width: 296px;
        border-radius: 20px 20px 6px 20px;
        background: var(--celadon-wash);
        padding: 13px 16px;
        font-size: 15px;
        line-height: 24px;
      }

      .assistant-copy {
        margin: 1px 0 0;
        color: var(--ink);
        font-size: 15px;
        line-height: 25px;
      }

      .assistant-copy strong {
        font-family: "Songti SC", "STSong", serif;
        font-size: 16px;
        font-weight: 600;
      }

      .task-stage {
        width: fit-content;
        max-width: 100%;
        margin: 0 0 8px;
        border-radius: 999px;
        padding: 5px 9px;
        background: rgba(220, 233, 226, 0.62);
        color: #55766c;
        font-size: 11px;
        font-weight: 500;
        line-height: 16px;
        letter-spacing: 0.03em;
      }

      .task-stage b { color: var(--jade); font-weight: 600; }

      .message-meta { margin-top: 7px; color: var(--ink-faint); font-size: 11px; line-height: 16px; }

      .choices { display: grid; gap: 9px; margin-top: 16px; }

      .choice {
        min-height: 52px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 17px;
        display: grid;
        grid-template-columns: 24px 1fr;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(255, 254, 250, 0.86);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .choice i { font-size: 21px; color: var(--ink-faint); }
      .choice:active { transform: scale(0.985); }

      .choice[aria-pressed="true"] {
        border-color: rgba(11, 112, 91, 0.68);
        background: var(--celadon-selected);
      }

      .choice[aria-pressed="true"] i { color: var(--jade); }
      .choice-label { font-size: 14px; font-weight: 500; line-height: 22px; }

      .confirm-row {
        margin-top: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .selection-count { color: var(--ink-soft); font-size: 12px; line-height: 18px; }

      .primary-button {
        min-height: 48px;
        border: 0;
        border-radius: 16px;
        padding: 0 18px;
        background: var(--jade);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow: 0 5px 14px rgba(11, 112, 91, 0.13);
        cursor: pointer;
      }

      .primary-button:active { background: var(--jade-pressed); transform: scale(0.98); }
      .primary-button:disabled { cursor: not-allowed; background: #9fb1aa; box-shadow: none; }

      .confirmed-choice {
        display: none;
        margin-top: 16px;
        min-height: 68px;
        border-left: 3px solid var(--jade);
        border-radius: 4px 18px 18px 4px;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        background: rgba(220, 233, 226, 0.7);
      }

      .confirmed-choice i { flex: 0 0 auto; margin-top: 2px; color: var(--jade); font-size: 20px; }
      .confirmed-choice strong,
      .confirmed-choice span { display: block; }
      .confirmed-choice strong { color: var(--pine); font-size: 13px; line-height: 20px; }
      .confirmed-choice span { margin-top: 2px; color: var(--ink-soft); font-size: 12px; line-height: 19px; }
      .confirmed-choice.is-visible { display: flex; }

      .composer {
        position: absolute;
        z-index: 7;
        inset: auto 0 0;
        min-height: calc(155px + env(safe-area-inset-bottom));
        padding: 50px 12px calc(10px + env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.98) 30%, #fff 100%);
      }

      .composer::before {
        position: absolute;
        z-index: 0;
        top: -110px;
        right: 0;
        left: 0;
        height: 150px;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff 16%, #fff 100%);
        pointer-events: none;
        content: "";
      }

      .composer-mascot {
        position: absolute;
        z-index: 2;
        top: -38px;
        left: 18px;
        width: 88px;
        height: 88px;
        overflow: hidden;
        pointer-events: none;
        clip-path: polygon(7% 0, 93% 0, 100% 64%, 96% 100%, 4% 100%, 0 64%);
        mix-blend-mode: multiply;
      }

      .composer-mascot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(1.075) contrast(1.07) saturate(0.9);
        transform: translateY(11px);
      }

      .composer-box {
        position: relative;
        z-index: 1;
        min-height: 95px;
        border: 1px solid rgba(183, 201, 193, 0.84);
        border-radius: 24px;
        background: rgba(255, 254, 250, 0.98);
        box-shadow: 0 8px 24px rgba(29, 44, 40, 0.08);
        overflow: hidden;
      }

      .composer-box textarea {
        display: block;
        width: 100%;
        height: 49px;
        resize: none;
        border: 0;
        outline: 0;
        padding: 14px 54px 6px 16px;
        background: transparent;
        color: var(--ink);
        font-size: 14px;
        line-height: 22px;
      }

      .composer-box textarea::placeholder { color: #7d8a86; }

      .composer-actions {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 7px 6px;
      }

      .composer-actions .icon-button { width: 44px; height: 44px; border-radius: 14px; }

      .send-button {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: var(--jade);
        color: #fff;
        box-shadow: 0 5px 14px rgba(11, 112, 91, 0.18);
        cursor: pointer;
      }

      .send-button i { font-size: 20px; }
      .send-button:active { background: var(--jade-pressed); transform: scale(0.95); }

      .drawer-layer { position: absolute; z-index: 20; inset: 0; visibility: hidden; pointer-events: none; }
      .drawer-layer.is-open { visibility: visible; pointer-events: auto; }

      .drawer-backdrop {
        position: absolute;
        inset: 0;
        border: 0;
        background: rgba(20, 35, 31, 0.32);
        opacity: 0;
        transition: opacity 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .drawer {
        position: absolute;
        inset: 0 auto 0 0;
        width: min(374px, 87%);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
          linear-gradient(rgba(250, 250, 246, 0.96), rgba(250, 250, 246, 0.96)),
          repeating-linear-gradient(92deg, rgba(23, 78, 64, 0.018) 0, rgba(23, 78, 64, 0.018) 1px, transparent 1px, transparent 5px);
        border-radius: 0 30px 30px 0;
        box-shadow: 16px 0 40px rgba(29, 44, 40, 0.16);
        transform: translateX(-100%);
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .drawer-layer.is-open .drawer-backdrop { opacity: 1; }
      .drawer-layer.is-open .drawer { transform: translateX(0); }

      .drawer-header {
        min-height: calc(88px + env(safe-area-inset-top));
        padding: calc(18px + env(safe-area-inset-top)) 16px 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .drawer-brand { flex: 1; display: flex; align-items: center; gap: 13px; color: var(--pine); }
      .drawer-brand .avatar { width: 46px; height: 46px; }

      .drawer-brand strong {
        font-family: "Songti SC", "STSong", serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .drawer-main {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 18px 190px;
        scrollbar-width: none;
      }

      .drawer-action {
        min-height: 56px;
        width: 100%;
        border: 0;
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: transparent;
        color: var(--pine);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .drawer-action i {
        width: 34px;
        height: 34px;
        border: 1.5px solid var(--pine);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 21px;
      }

      .search-box {
        min-height: 52px;
        margin-top: 7px;
        border: 1px solid rgba(212, 222, 217, 0.74);
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 15px;
        background: rgba(242, 245, 241, 0.8);
        color: var(--ink-faint);
        font-size: 14px;
      }

      .search-box i { font-size: 21px; }

      .section-label {
        margin: 28px 8px 10px;
        color: #66847a;
        font-family: "Songti SC", "STSong", serif;
        font-size: 13px;
        font-weight: 600;
        line-height: 18px;
        letter-spacing: 0.08em;
      }

      .conversation-row {
        position: relative;
        min-height: 76px;
        width: 100%;
        border: 0;
        border-radius: 18px;
        display: grid;
        grid-template-columns: 24px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 10px 10px 10px 14px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .conversation-row + .conversation-row { margin-top: 3px; }
      .conversation-row i { color: var(--ink-soft); font-size: 22px; }
      .conversation-row.is-current { background: rgba(229, 238, 233, 0.82); }

      .conversation-row.is-current::before {
        position: absolute;
        inset: 16px auto 16px 0;
        width: 3px;
        border-radius: 999px;
        background: var(--jade);
        content: "";
      }

      .conversation-row.is-current i { color: var(--jade); }
      .conversation-copy { min-width: 0; }

      .conversation-copy strong,
      .conversation-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .conversation-copy strong {
        font-family: "Songti SC", "STSong", serif;
        font-size: 15px;
        font-weight: 600;
        line-height: 23px;
      }

      .conversation-copy span,
      .conversation-time { color: var(--ink-soft); font-size: 11px; line-height: 18px; }

      .drawer-wash {
        position: absolute;
        z-index: 0;
        right: 0;
        bottom: calc(144px + env(safe-area-inset-bottom));
        left: 0;
        height: 180px;
        overflow: hidden;
        pointer-events: none;
        opacity: 0.14;
      }

      .drawer-wash::before,
      .drawer-wash::after {
        position: absolute;
        border-radius: 50% 50% 0 0;
        background: rgba(62, 121, 101, 0.32);
        filter: blur(1px);
        content: "";
      }

      .drawer-wash::before { right: -24px; bottom: -80px; width: 250px; height: 160px; transform: rotate(-7deg); }
      .drawer-wash::after { bottom: -95px; left: -38px; width: 230px; height: 170px; transform: rotate(8deg); }

      .drawer-footer {
        position: relative;
        z-index: 2;
        padding: 12px 18px calc(16px + env(safe-area-inset-bottom));
        background: rgba(250, 250, 246, 0.94);
        border-top: 1px solid rgba(212, 222, 217, 0.74);
        backdrop-filter: blur(12px);
      }

      .drawer-nav {
        min-height: 56px;
        width: 100%;
        border: 0;
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        background: transparent;
        font-family: "Songti SC", "STSong", serif;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .drawer-nav i { color: var(--pine); font-size: 23px; }

      .drawer-action:active,
      .drawer-nav:active,
      .conversation-row:active { background: var(--celadon-wash); }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-height: 720px) {
        .composer-mascot { display: none; }
        .conversation { padding-bottom: 34px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="phone-screen" data-testid="mobile-design-screen" aria-label="老己移动端对话主画面探索稿">
        <header class="app-header">
          <button class="icon-button" id="menuButton" type="button" aria-label="打开导航" aria-expanded="false">
            <i class="ph ph-list" aria-hidden="true"></i>
          </button>
          <div class="conversation-title" aria-label="会话名称">
            <strong>《活着》读书分享</strong>
          </div>
          <span class="header-spacer" aria-hidden="true"></span>
        </header>

        <div class="conversation" id="conversation" aria-live="polite">
          <p class="date-label">今天 10:22</p>

          <article class="message user">
            <div class="message-body">
              <div class="user-bubble">帮我把《活着》的读书笔记整理成一份读书会分享 PPT。</div>
              <div class="message-meta" style="text-align: right">10:22</div>
            </div>
          </article>

          <article class="message assistant">
            <img class="avatar" src="../../../assets/avatar/laoji-avatar-qingci-chibi-v2.png" alt="老己" />
            <div class="message-body">
              <!-- 仅在会话中存在进行中的任务时显示；普通对话不渲染。 -->
              <p class="task-stage" aria-label="当前任务阶段">PPT 任务 · 范围与需求 · <b>1 / 4</b></p>
              <p class="assistant-copy"><strong>好呀。</strong>这次想重点覆盖哪些内容？可以多选。</p>
              <div class="choices" id="choices" aria-label="选择内容范围">
                <button class="choice" type="button" aria-pressed="true" data-value="全书">
                  <i class="ph ph-check-circle" aria-hidden="true"></i>
                  <span class="choice-label">全书</span>
                </button>
                <button class="choice" type="button" aria-pressed="false" data-value="我的划线与想法">
                  <i class="ph ph-circle" aria-hidden="true"></i>
                  <span class="choice-label">我的划线与想法</span>
                </button>
                <button class="choice" type="button" aria-pressed="true" data-value="老己笔记">
                  <i class="ph ph-check-circle" aria-hidden="true"></i>
                  <span class="choice-label">老己笔记</span>
                </button>
              </div>
              <div class="confirm-row" id="confirmRow">
                <span class="selection-count" id="selectionCount">已选 2 项</span>
                <button class="primary-button" id="confirmButton" type="button">确认范围</button>
              </div>
              <div class="confirmed-choice" id="confirmedChoice">
                <i class="ph ph-check-circle" aria-hidden="true"></i>
                <div>
                  <strong>已确认范围</strong>
                  <span id="confirmedText">全书 · 老己笔记</span>
                </div>
              </div>
            </div>
          </article>
        </div>

        <form class="composer" id="composer">
          <!-- 探索稿临时合成：当前候选仍为 RGB 棋盘格图，进入原型前必须替换为已确认透明资产。 -->
          <div class="composer-mascot" aria-hidden="true">
            <img src="../mascot-exploration-v1/laoji-prone-peek-transparent-v1.png" alt="" />
          </div>
          <div class="composer-box">
            <label class="sr-only" for="messageInput">继续补充要求</label>
            <textarea id="messageInput" rows="1" placeholder="继续补充要求…"></textarea>
            <div class="composer-actions">
              <button class="icon-button" type="button" aria-label="添加附件">
                <i class="ph ph-paperclip" aria-hidden="true"></i>
              </button>
              <button class="send-button" type="submit" aria-label="发送消息">
                <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </form>

        <div class="drawer-layer" id="drawerLayer" aria-hidden="true">
          <button class="drawer-backdrop" id="drawerBackdrop" type="button" aria-label="关闭导航"></button>
          <aside class="drawer" id="drawer" aria-label="主导航">
            <div class="drawer-header">
              <div class="drawer-brand">
                <img class="avatar" src="../../../assets/avatar/laoji-avatar-qingci-chibi-v2.png" alt="" />
                <strong>老己</strong>
              </div>
              <button class="icon-button" id="closeDrawer" type="button" aria-label="关闭导航">
                <i class="ph ph-x" aria-hidden="true"></i>
              </button>
            </div>
            <div class="drawer-main">
              <button class="drawer-action" type="button">
                <i class="ph ph-plus" aria-hidden="true"></i>
                <span>新建对话</span>
              </button>
              <div class="search-box" role="search">
                <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                <span>搜索对话</span>
              </div>
              <p class="section-label">最近对话</p>
              <button class="conversation-row is-current" type="button" aria-current="page">
                <i class="ph ph-chat-circle" aria-hidden="true"></i>
                <span class="conversation-copy">
                  <strong>《活着》读书分享</strong>
                  <span>范围与需求 · 已选内容范围</span>
                </span>
                <span class="conversation-time">10:22</span>
              </button>
              <button class="conversation-row" type="button">
                <i class="ph ph-chat-circle" aria-hidden="true"></i>
                <span class="conversation-copy">
                  <strong>阅读方法与书单整理</strong>
                  <span>高效阅读技巧总结</span>
                </span>
                <span class="conversation-time">昨天</span>
              </button>
              <button class="conversation-row" type="button">
                <i class="ph ph-chat-circle" aria-hidden="true"></i>
                <span class="conversation-copy">
                  <strong>《百年孤独》阅读笔记</strong>
                  <span>摘录与思考整理</span>
                </span>
                <span class="conversation-time">3 天前</span>
              </button>
            </div>
            <div class="drawer-wash" aria-hidden="true"></div>
            <nav class="drawer-footer" aria-label="其他页面">
              <button class="drawer-nav" type="button">
                <i class="ph ph-book-open" aria-hidden="true"></i>
                <span>读书</span>
              </button>
              <button class="drawer-nav" type="button">
                <i class="ph ph-gear" aria-hidden="true"></i>
                <span>设置</span>
              </button>
            </nav>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const menuButton = document.querySelector("#menuButton");
      const drawerLayer = document.querySelector("#drawerLayer");
      const closeDrawerButton = document.querySelector("#closeDrawer");
      const drawerBackdrop = document.querySelector("#drawerBackdrop");
      const choices = [...document.querySelectorAll(".choice")];
      const selectionCount = document.querySelector("#selectionCount");
      const confirmButton = document.querySelector("#confirmButton");
      const confirmRow = document.querySelector("#confirmRow");
      const choicesGroup = document.querySelector("#choices");
      const confirmedChoice = document.querySelector("#confirmedChoice");
      const confirmedText = document.querySelector("#confirmedText");
      const composer = document.querySelector("#composer");
      const messageInput = document.querySelector("#messageInput");
      const conversation = document.querySelector("#conversation");

      function openDrawer() {
        drawerLayer.classList.add("is-open");
        drawerLayer.setAttribute("aria-hidden", "false");
        menuButton.setAttribute("aria-expanded", "true");
        closeDrawerButton.focus();
      }

      function closeDrawer() {
        drawerLayer.classList.remove("is-open");
        drawerLayer.setAttribute("aria-hidden", "true");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.focus();
      }

      function updateSelectionCount() {
        const count = choices.filter((choice) => choice.getAttribute("aria-pressed") === "true").length;
        selectionCount.textContent = `已选 ${count} 项`;
        confirmButton.disabled = count === 0;
      }

      menuButton.addEventListener("click", openDrawer);
      closeDrawerButton.addEventListener("click", closeDrawer);
      drawerBackdrop.addEventListener("click", closeDrawer);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && drawerLayer.classList.contains("is-open")) closeDrawer();
      });

      choices.forEach((choice) => {
        choice.addEventListener("click", () => {
          const selected = choice.getAttribute("aria-pressed") === "true";
          choice.setAttribute("aria-pressed", String(!selected));
          choice.querySelector("i").className = selected ? "ph ph-circle" : "ph ph-check-circle";
          updateSelectionCount();
        });
      });

      confirmButton.addEventListener("click", () => {
        const values = choices
          .filter((choice) => choice.getAttribute("aria-pressed") === "true")
          .map((choice) => choice.dataset.value);
        confirmedText.textContent = values.join(" · ");
        choicesGroup.hidden = true;
        confirmRow.hidden = true;
        confirmedChoice.classList.add("is-visible");
      });

      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = messageInput.value.trim();
        if (!text) {
          messageInput.focus();
          return;
        }
        const article = document.createElement("article");
        article.className = "message user";
        const body = document.createElement("div");
        body.className = "message-body";
        const bubble = document.createElement("div");
        bubble.className = "user-bubble";
        bubble.textContent = text;
        body.appendChild(bubble);
        article.appendChild(body);
        conversation.appendChild(article);
        messageInput.value = "";
        conversation.scrollTop = conversation.scrollHeight;
      });

      updateSelectionCount();
    </script>
  </body>
</html>
