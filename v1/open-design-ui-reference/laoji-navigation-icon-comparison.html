<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老己主导航图标对比</title>
  <style>
    :root {
      --bg: #f3f7f5;
      --paper: #fbfdfc;
      --ink: #243a33;
      --muted: #687871;
      --line: #d7e0db;
      --accent: #246b59;
      --accent-soft: #deece6;
      --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
      --brand: "Kaiti SC", STKaiti, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: var(--sans); }
    button { font: inherit; color: inherit; }
    .page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.15; letter-spacing: -.035em; }
    .lead { max-width: 760px; margin: 14px 0 30px; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .reference { display: grid; grid-template-columns: minmax(260px, .88fr) minmax(320px, 1.12fr); gap: 20px; margin-bottom: 28px; }
    .reference-shot { min-height: 430px; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper) url("laoji-chat-desktop-mobile.png") 0 0 / 1296px 864px no-repeat; box-shadow: 0 18px 50px rgba(35, 67, 57, .1); }
    .reference-copy { display: flex; flex-direction: column; justify-content: center; padding: 30px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
    .reference-copy h2 { margin: 0; font-size: 24px; }
    .reference-copy ul { margin: 16px 0 0; padding-left: 20px; color: var(--muted); line-height: 1.9; }
    .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .option { padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); text-align: left; cursor: pointer; transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease; }
    .option:hover { transform: translateY(-2px); box-shadow: 0 16px 42px rgba(35, 67, 57, .12); }
    .option[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 107, 89, .13), 0 18px 45px rgba(35, 67, 57, .13); }
    .preview { padding: 24px; background: #eef5f1; }
    .sidebar { width: 188px; min-height: 390px; display: flex; flex-direction: column; margin: auto; padding: 22px 14px 18px; border: 1px solid var(--line); border-radius: 16px; background: #f5f9f7; box-shadow: 0 14px 34px rgba(35, 67, 57, .1); }
    .brand { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 0 8px 24px; border-bottom: 1px solid var(--line); }
    .brand img { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; }
    .brand strong { font: 500 25px/1 var(--brand); letter-spacing: .06em; white-space: nowrap; }
    .nav { display: grid; gap: 7px; margin-top: 24px; }
    .nav-item { min-height: 48px; display: flex; align-items: center; gap: 13px; padding: 0 13px; border-radius: 9px; color: #52635c; font-size: 14px; }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .icon { width: 20px; height: 20px; flex: 0 0 20px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    .strict .icon { stroke-width: 1.75; }
    .soft .icon { stroke-width: 1.5; }
    .soft .nav-item { border-radius: 12px; }
    .measure { margin-top: auto; padding: 14px 10px 0; color: #7a8782; font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .mobile-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: min(330px, 100%); margin: 18px auto 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 15px; background: var(--paper); box-shadow: 0 10px 26px rgba(35, 67, 57, .08); }
    .mobile-item { min-height: 52px; display: grid; place-items: center; align-content: center; gap: 3px; color: #63736c; font-size: 11px; }
    .mobile-item.active { color: var(--accent); font-weight: 600; }
    .mobile-item .icon { width: 19px; height: 19px; }
    .option-copy { padding: 22px 24px 24px; }
    .option-copy h3 { margin: 0 0 8px; font-size: 20px; }
    .option-copy p { margin: 0; color: var(--muted); line-height: 1.75; }
    .recommended { display: inline-flex; margin-bottom: 10px; padding: 4px 8px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-size: 11px; font-weight: 700; }
    .selection { margin: 22px 0 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--muted); }
    @media (max-width: 820px) {
      .page { padding-top: 28px; }
      .reference, .options { grid-template-columns: 1fr; }
      .reference-shot { min-height: 350px; background-size: 1080px 720px; }
    }
  </style>
</head>
<body>
  <main class="page" data-od-id="navigation-icon-comparison">
    <p class="eyebrow">IMAGE2 REFERENCE CHECK</p>
    <h1 data-od-id="comparison-heading">主导航图标与品牌锁定对比</h1>
    <p class="lead">上方是 Image2 参考图的真实局部；下方是两套准备落地的本地 SVG。两套都会固定 Logo、品牌字和图标尺寸，页面切换时不再缩放。</p>

    <section class="reference" data-od-id="image2-reference">
      <div class="reference-shot" role="img" aria-label="Image2 参考图左侧导航"></div>
      <div class="reference-copy">
        <p class="eyebrow">参考特征</p>
        <h2>清晰、克制、工具感</h2>
        <ul>
          <li>对话：方圆角气泡，内部两枚圆点。</li>
          <li>读书：对称打开书本，中缝清晰。</li>
          <li>设置：细线齿轮，中心留白。</li>
          <li>图标约 19–20px，线宽接近 1.7px。</li>
          <li>选中态只改变颜色与浅青瓷底，不改变尺寸。</li>
        </ul>
      </div>
    </section>

    <section class="options" aria-label="图标方向选择">
      <button class="option strict" type="button" aria-pressed="false" data-choice="A" data-od-id="icon-option-image2">
        <div class="preview">
          <div class="sidebar">
            <div class="brand"><img src="../prototype/assets/laoji-default-avatar.png" alt=""><strong>老己</strong></div>
            <div class="nav">
              <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 5.4h9.8a3.6 3.6 0 0 1 3.6 3.6v5.8a3.6 3.6 0 0 1-3.6 3.6H11l-3.8 2.2.7-2.2h-.8a3.6 3.6 0 0 1-3.6-3.6V9a3.6 3.6 0 0 1 3.6-3.6Z"/><circle cx="9" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r=".8" fill="currentColor" stroke="none"/></svg><span>对话</span></div>
              <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 5.5c2.7-.7 5.3-.2 8.2 1.8v12c-2.9-2-5.5-2.5-8.2-1.8v-12Z"/><path d="M20.2 5.5c-2.7-.7-5.3-.2-8.2 1.8v12c2.9-2 5.5-2.5 8.2-1.8v-12Z"/></svg><span>读书</span></div>
              <div class="nav-item"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.7h4.8l.7 2.2 2 .9 2.1-1 2.4 4.1-1.7 1.5v2.2l1.7 1.5-2.4 4.1-2.1-1-2 .9-.7 2.2H9.6l-.7-2.2-2-.9-2.1 1-2.4-4.1 1.7-1.5v-2.2L2.4 9.9l2.4-4.1 2.1 1 2-.9.7-2.2Z"/><circle cx="12" cy="12.5" r="3"/></svg><span>设置</span></div>
            </div>
            <div class="measure">Logo 38px · 老己 25px<br>图标 20px · 线宽 1.75px</div>
          </div>
          <div class="mobile-nav">
            <span class="mobile-item active"><svg class="icon" viewBox="0 0 24 24"><path d="M7.1 5.4h9.8a3.6 3.6 0 0 1 3.6 3.6v5.8a3.6 3.6 0 0 1-3.6 3.6H11l-3.8 2.2.7-2.2h-.8a3.6 3.6 0 0 1-3.6-3.6V9a3.6 3.6 0 0 1 3.6-3.6Z"/><circle cx="9" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r=".8" fill="currentColor" stroke="none"/></svg>对话</span>
            <span class="mobile-item"><svg class="icon" viewBox="0 0 24 24"><path d="M3.8 5.5c2.7-.7 5.3-.2 8.2 1.8v12c-2.9-2-5.5-2.5-8.2-1.8v-12Z"/><path d="M20.2 5.5c-2.7-.7-5.3-.2-8.2 1.8v12c2.9-2 5.5-2.5 8.2-1.8v-12Z"/></svg>读书</span>
            <span class="mobile-item"><svg class="icon" viewBox="0 0 24 24"><path d="M9.6 3.7h4.8l.7 2.2 2 .9 2.1-1 2.4 4.1-1.7 1.5v2.2l1.7 1.5-2.4 4.1-2.1-1-2 .9-.7 2.2H9.6l-.7-2.2-2-.9-2.1 1-2.4-4.1 1.7-1.5v-2.2L2.4 9.9l2.4-4.1 2.1 1 2-.9.7-2.2Z"/><circle cx="12" cy="12.5" r="3"/></svg>设置</span>
          </div>
        </div>
        <div class="option-copy"><span class="recommended">推荐</span><h3>A · 严格贴近 Image2</h3><p>轮廓、线宽和工具感最接近参考图，桌面与移动端复用同一套 SVG。</p></div>
      </button>

      <button class="option soft" type="button" aria-pressed="false" data-choice="B" data-od-id="icon-option-soft">
        <div class="preview">
          <div class="sidebar">
            <div class="brand"><img src="../prototype/assets/laoji-default-avatar.png" alt=""><strong>老己</strong></div>
            <div class="nav">
              <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24"><path d="M7 5h10a4 4 0 0 1 4 4v5.6a4 4 0 0 1-4 4h-5.7L7 21l.8-2.4H7a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4Z"/><circle cx="9" cy="12" r=".75" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r=".75" fill="currentColor" stroke="none"/></svg><span>对话</span></div>
              <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5.8c2.7-.8 5.4-.1 8 1.8v11.5c-2.6-1.9-5.3-2.6-8-1.8V5.8Z"/><path d="M20 5.8c-2.7-.8-5.4-.1-8 1.8v11.5c2.6-1.9 5.3-2.6 8-1.8V5.8Z"/></svg><span>读书</span></div>
              <div class="nav-item"><svg class="icon" viewBox="0 0 24 24"><path d="M10 4h4l.7 2.2 2.1.9 2.1-1 2 3.5-1.7 1.6v2.4l1.7 1.6-2 3.5-2.1-1-2.1.9L14 21h-4l-.7-2.4-2.1-.9-2.1 1-2-3.5 1.7-1.6v-2.4L3.1 9.6l2-3.5 2.1 1 2.1-.9L10 4Z"/><circle cx="12" cy="12.4" r="2.8"/></svg><span>设置</span></div>
            </div>
            <div class="measure">Logo 38px · 老己 25px<br>图标 20px · 线宽 1.5px</div>
          </div>
          <div class="mobile-nav"><span class="mobile-item active">对话</span><span class="mobile-item">读书</span><span class="mobile-item">设置</span></div>
        </div>
        <div class="option-copy"><h3>B · 青瓷柔化版</h3><p>圆角更大、描边更细，气质更温和，但比 Image2 的参考图稍显柔弱。</p></div>
      </button>
    </section>

    <p class="selection" data-od-id="selection-status">尚未选择。建议选择 A。</p>
  </main>
  <script>
    const options = [...document.querySelectorAll('.option')];
    const status = document.querySelector('.selection');
    options.forEach((option) => option.addEventListener('click', () => {
      options.forEach((item) => item.setAttribute('aria-pressed', String(item === option)));
      status.textContent = `已选择 ${option.dataset.choice}。请回到对话告诉我是否按此版本实施。`;
    }));
  </script>
</body>
</html>
