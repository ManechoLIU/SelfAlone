<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · 老己</title>
  <link rel="stylesheet" href="assets/laoji.css">
  <link rel="stylesheet" href="assets/laoji-auth-ink.css">
  <script defer src="assets/laoji-navigation.js"></script>
  <script defer src="assets/laoji-state.js"></script>
  <script defer src="assets/laoji.js"></script>
</head>
<body class="auth-ink-page">
  <main class="auth-shell auth-ink-shell" data-od-id="reset-password-screen">
    <aside class="auth-aside" data-od-id="reset-brand-panel">
      <a class="auth-brand" href="laoji-login.html" aria-label="返回登录">
        <img class="auth-ink-avatar" src="assets/laoji-default-avatar.png" alt="老己古风女孩头像">
        <span class="auth-brand-name">老己</span>
      </a>
      <div class="auth-ink-window" aria-hidden="true"><span class="auth-ink-sun"></span><span class="auth-ink-mist"></span></div>
      <div class="auth-aside-copy">
        <p class="eyebrow">账户恢复</p>
        <h1>沿原路回来，继续未完的一页。</h1>
        <p>设置新密码后，即可继续未完的阅读与创作。</p>
      </div>
      <p class="auth-ink-mobile-motto">沿原路回来<br>继续未完的一页</p>
      <div class="auth-ink-signature" aria-hidden="true">一卷一世界 · 一念一回响</div>
    </aside>
    <section class="auth-main" data-od-id="reset-form-region">
      <div class="auth-card">
        <header class="auth-card-head"><p class="eyebrow">账户恢复</p><h1 data-reset-card-title>找回密码</h1><p data-reset-card-copy>输入账户邮箱，我们会发送重置链接。</p></header>

        <section data-reset-view="request">
          <form class="form-grid" data-password-recovery-request novalidate>
            <div class="field">
              <label for="reset-email">邮箱</label>
              <input class="input" id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
              <p class="field-error" data-reset-request-email-error aria-live="polite"></p>
            </div>
            <p class="field-error" data-reset-request-error aria-live="polite"></p>
            <button class="btn btn-primary auth-submit" type="submit" data-reset-request-submit>发送重置邮件</button>
          </form>
          <p class="auth-switch"><a class="text-link" href="laoji-login.html">返回登录</a></p>
        </section>

        <section data-reset-view="sent" hidden>
          <h2 data-reset-view-heading tabindex="-1">检查邮箱</h2>
          <p>如果该邮箱已注册，重置邮件已经发送。</p>
          <p class="muted">请打开邮件中的链接继续，也可在此设置新密码。</p>
          <div class="auth-result-actions"><a class="btn btn-primary" href="laoji-reset-password.html?mode=new">设置新密码</a></div>
        </section>

        <section data-reset-view="expired" hidden>
          <h2 data-reset-view-heading tabindex="-1">链接已失效</h2>
          <p>该重置链接已不再有效。请重新申请一封重置邮件。</p>
          <div class="auth-result-actions"><a class="btn btn-primary" href="laoji-reset-password.html?mode=request">重新发送重置邮件</a></div>
        </section>

        <section data-reset-view="new" hidden>
          <form class="form-grid" data-auth-form="reset-password" novalidate>
          <div class="field">
            <label for="reset-password">新密码</label>
            <div class="password-wrap">
              <input class="input" id="reset-password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" data-auth-field="password" required>
              <button class="password-toggle" type="button" data-toggle-password="reset-password" data-password-icon data-password-label="新密码" aria-label="显示新密码" aria-pressed="false" data-od-id="reset-password-toggle">
                <svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
                <svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18"></path><path d="M10.6 6.15A10.5 10.5 0 0 1 12 6c6 0 9.5 6 9.5 6a14 14 0 0 1-2.15 2.72"></path><path d="M6.55 6.55C3.92 8.2 2.5 12 2.5 12S6 18 12 18c1.42 0 2.7-.34 3.82-.84"></path><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path></svg>
              </button>
            </div>
            <p class="field-error" data-auth-error="password" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="reset-confirm">确认密码</label>
            <div class="password-wrap">
              <input class="input" id="reset-confirm" name="confirm" type="password" minlength="8" maxlength="64" autocomplete="new-password" data-auth-field="confirm" required>
              <button class="password-toggle" type="button" data-toggle-password="reset-confirm" data-password-icon data-password-label="确认密码" aria-label="显示确认密码" aria-pressed="false" data-od-id="reset-confirm-toggle">
                <svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg>
                <svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18"></path><path d="M10.6 6.15A10.5 10.5 0 0 1 12 6c6 0 9.5 6 9.5 6a14 14 0 0 1-2.15 2.72"></path><path d="M6.55 6.55C3.92 8.2 2.5 12 2.5 12S6 18 12 18c1.42 0 2.7-.34 3.82-.84"></path><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path></svg>
              </button>
            </div>
            <p class="field-error" data-auth-error="confirm" aria-live="polite"></p>
          </div>
          <p class="muted">密码需为 8–64 个字符。</p>
          <p class="field-error" data-auth-error="form" aria-live="polite"></p>
          <button class="btn btn-primary auth-submit" type="submit" data-auth-submit data-od-id="save-reset-password-button" disabled>保存新密码</button>
          </form>
          <p class="auth-switch"><a class="text-link" href="laoji-login.html">返回登录</a></p>
        </section>

        <section class="auth-result" data-reset-view="success" hidden aria-live="polite">
          <h2 data-reset-view-heading tabindex="-1">密码已更新</h2>
          <p class="muted">现在可以使用新密码登录。</p>
          <div class="auth-result-actions"><a class="btn btn-primary" href="laoji-login.html">返回登录</a></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
