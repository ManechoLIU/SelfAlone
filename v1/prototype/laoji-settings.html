<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置 · 老己</title>
  <script src="assets/laoji-navigation.js?v=20260814-unified-shell-r3"></script>
  <link rel="stylesheet" href="assets/laoji.css?v=20260814-unified-shell-r3">
  <script defer src="assets/laoji-state.js?v=20260814-unified-shell-r3"></script>
  <script defer src="assets/laoji.js?v=20260812-profile-editor-account-email"></script>
  <style>
    [data-od-id="settings-shell"] .settings-wrap.settings-home { max-width: 980px; }
    [data-od-id="settings-shell"] .settings-intro { display: none; }
    [data-settings-compact-grid] {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }
    [data-settings-compact-grid] .settings-group { gap: 10px; }
    [data-settings-compact-grid] .settings-group + .settings-group { margin-top: 0; }
    [data-settings-compact-grid] .section-head { margin: 0; }
    [data-settings-compact-grid] .section-head h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
    }
    [data-settings-compact-grid] .settings-list {
      border-radius: 16px;
      box-shadow: 0 1px 0 oklch(0.3 0.02 175 / 0.03);
    }
    [data-settings-compact-grid] .settings-row {
      width: 100%;
      min-height: 60px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 140ms ease;
    }
    [data-settings-compact-grid] .settings-row + .settings-row { border-top: 1px solid var(--border); }
    [data-settings-compact-grid] .settings-row:hover { background: var(--paper-strong); }
    [data-settings-compact-grid] .settings-row:active { background: var(--jade-pale); }
    [data-settings-compact-grid] .settings-row:focus-visible {
      position: relative;
      z-index: 1;
      outline: 2px solid var(--jade);
      outline-offset: -2px;
    }
    [data-settings-compact-grid] .settings-row-title { font-size: 15px; font-weight: 650; }
    [data-settings-compact-grid] .settings-state {
      min-width: 0;
      max-width: min(42vw, 260px);
      overflow: hidden;
      font-size: 13px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    [data-settings-compact-grid] .settings-row-chevron {
      color: var(--muted);
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      transform: translateY(-1px);
    }
    [data-settings-compact-grid] .settings-row.danger-copy,
    [data-settings-compact-grid] .settings-row.danger-copy .settings-row-chevron { color: var(--danger); }
    [data-mobile-settings-summary] {
      width: 100%;
      min-height: 88px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      color: var(--fg);
      text-align: left;
      box-shadow: 0 6px 20px oklch(0.31 0.025 170 / .055);
      cursor: pointer;
    }
    [data-mobile-settings-summary]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .mobile-settings-summary-avatar { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); }
    .mobile-settings-summary-copy { min-width: 0; display: grid; gap: 3px; }
    .mobile-settings-summary-copy strong,
    .mobile-settings-summary-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mobile-settings-summary-copy strong { font-size: 18px; font-weight: 650; }
    .mobile-settings-summary-copy span { color: var(--muted-strong); font-size: 13px; }
    .mobile-settings-summary-chevron { color: var(--muted); font-size: 26px; font-weight: 300; line-height: 1; }
    @media (max-width: 767px) {
      [data-mobile-settings-shell],
      [data-mobile-settings-shell] .main,
      [data-mobile-settings-shell] .settings-wrap,
      [data-mobile-settings-shell] [data-settings-compact-grid],
      [data-mobile-settings-shell] .settings-group,
      [data-mobile-settings-shell] .settings-list,
      [data-mobile-settings-shell] .settings-row { min-width: 0; max-width: 100%; }
      [data-mobile-settings-shell] .main {
        padding: 18px 16px 28px;
        overflow-x: clip;
      }
      [data-mobile-settings-shell] .settings-wrap.settings-home { gap: 24px; }
      [data-mobile-settings-summary] {
        width: 100%;
        min-height: 76px;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 13px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--white);
        color: var(--fg);
        text-align: left;
        box-shadow: 0 6px 20px oklch(0.31 0.025 170 / .055);
        cursor: pointer;
      }
      .mobile-settings-summary-avatar { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--border); border-radius: 50%; background: var(--surface); }
      .mobile-settings-summary-copy strong { font-size: 17px; font-weight: 650; }
      .mobile-settings-summary-copy span { color: var(--muted-strong); font-size: 12px; }
      .mobile-settings-summary-chevron { color: var(--muted); font-size: 25px; font-weight: 300; line-height: 1; }

      [data-settings-compact-grid] { gap: 24px; }
      [data-settings-compact-grid] .section-head h2 { color: var(--muted-strong); font-size: 13px; font-weight: 650; letter-spacing: .03em; }
      [data-settings-compact-grid] .settings-row {
        min-height: 58px;
        padding-inline: 16px 13px;
      }
      [data-settings-compact-grid] .settings-list { border-radius: 14px; }
      [data-od-id="data-account-settings-section"] .settings-list { overflow: visible; border: 0; background: transparent; }
      [data-od-id="data-account-settings-section"] .settings-row:not(.settings-danger-row) { border-inline: 1px solid var(--border); background: var(--white); }
      [data-od-id="data-account-settings-section"] .settings-row:first-child { border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; }
      [data-od-id="data-account-settings-section"] .settings-row:nth-last-child(2) { border-bottom: 1px solid var(--border); border-radius: 0 0 14px 14px; }
      [data-settings-compact-grid] .settings-row.settings-danger-row {
        margin-top: 16px;
        border: 1px solid color-mix(in oklch, var(--danger) 30%, var(--border));
        border-radius: 14px;
        background: var(--white);
      }

    }
    @media (prefers-reduced-motion: reduce) {
      [data-settings-compact-grid] .settings-row { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell" data-mobile-settings-shell data-od-id="settings-shell">
    <aside class="side-nav" data-od-id="settings-side-nav">
      <a class="brand-lockup" href="laoji-settings.html" aria-label="打开个人设置" data-od-id="settings-profile-entry">
        <img class="user-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像" data-user-avatar>
        <span class="brand-name-wrap"><span class="brand-name">老己</span></span>
      </a>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-link" href="laoji-chat.html"><span class="nav-dot"></span><span class="nav-text">对话</span></a>
        <a class="nav-link" href="laoji-library.html"><span class="nav-dot"></span><span class="nav-text">读书</span></a>
        <a class="nav-link" href="laoji-settings.html" aria-current="page"><span class="nav-dot"></span><span class="nav-text">设置</span></a>
      </nav>
      <div class="side-foot">资料与作品<br>随账户保留</div>
    </aside>

    <header class="topbar" data-od-id="settings-header">
      <div class="topbar-title">
        <h1 data-od-id="settings-heading">设置</h1>
      </div>
    </header>

    <main class="main">
      <div class="settings-wrap settings-home stack">
        <p class="settings-intro">管理头像、个人资料、连接服务与账户安全。</p>

        <a class="mobile-settings-profile-summary" href="laoji-profile-settings.html" data-mobile-settings-summary data-od-id="mobile-profile-summary">
          <img class="mobile-settings-summary-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像" data-user-avatar>
          <span class="mobile-settings-summary-copy"><strong data-user-name>老己用户</strong><span>头像与昵称</span></span>
          <span class="mobile-settings-summary-chevron" aria-hidden="true">›</span>
        </a>

        <div data-settings-compact-grid>
          <section class="settings-group" data-od-id="connection-settings-section">
            <div class="section-head"><h2>连接服务</h2></div>
            <div class="settings-list">
              <a class="settings-row" href="laoji-ai-setup.html" data-od-id="ai-service-settings-card"><span class="settings-row-title">AI 服务</span><span class="settings-state" data-ai-connection-state>未配置</span><span class="settings-row-chevron" aria-hidden="true">›</span></a>
              <a class="settings-row" href="laoji-weread-setup.html" data-od-id="weread-settings-card"><span class="settings-row-title">微信读书</span><span class="settings-state" data-weread-connection-state>未配置</span><span class="settings-row-chevron" aria-hidden="true">›</span></a>
            </div>
          </section>

          <section class="settings-group" data-od-id="data-account-settings-section">
            <div class="section-head"><h2>账户与安全</h2></div>
            <div class="settings-list">
              <a class="settings-row" href="laoji-account-email.html" data-account-email-entry data-od-id="email-settings-card"><span class="settings-row-title">登录邮箱</span><span class="settings-state" data-profile-email-value>you@example.com</span><span class="settings-row-chevron" aria-hidden="true">›</span></a>
              <button class="settings-row" type="button" data-toast="修改密码邮件已发送，请前往邮箱查收" data-od-id="password-settings-card"><span class="settings-row-title">修改密码</span><span></span><span class="settings-row-chevron" aria-hidden="true">›</span></button>
              <button class="settings-row" type="button" data-dialog-open="logout-dialog" data-od-id="logout-settings-card"><span class="settings-row-title">退出登录</span><span></span><span class="settings-row-chevron" aria-hidden="true">›</span></button>
              <button class="settings-row settings-danger-row danger-copy" type="button" data-dialog-open="delete-account-dialog" data-od-id="delete-account-settings-card"><span class="settings-row-title">删除账户</span><span></span><span class="settings-row-chevron" aria-hidden="true">›</span></button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="手机主导航">
      <a class="bottom-link" href="laoji-chat.html">对话</a>
      <a class="bottom-link" href="laoji-library.html">读书</a>
      <a class="bottom-link" href="laoji-settings.html" aria-current="page">设置</a>
    </nav>
  </div>

  <dialog id="logout-dialog" data-od-id="logout-dialog" aria-labelledby="logout-dialog-title">
    <div class="dialog-head"><h2 id="logout-dialog-title" tabindex="-1">退出当前账户？</h2><button class="btn btn-ghost icon-btn" type="button" aria-label="关闭" data-dialog-close>×</button></div>
    <div class="dialog-body"><p>退出后需要重新登录，你的书籍、笔记和作品不会因此删除。</p></div>
    <div class="dialog-actions"><button class="btn" type="button" data-dialog-close>取消</button><button class="btn btn-primary" type="button" data-account-action="logout">确认退出</button></div>
  </dialog>

  <dialog id="delete-account-dialog" data-od-id="delete-account-dialog" aria-labelledby="delete-account-dialog-title">
    <div class="dialog-head"><h2 id="delete-account-dialog-title" tabindex="-1">永久删除账户？</h2><button class="btn btn-ghost icon-btn" type="button" aria-label="关闭" data-dialog-close>×</button></div>
    <div class="dialog-body"><div class="notice error"><span class="notice-dot"></span><p><strong>此操作不可恢复</strong><br><span class="muted">账户、书籍、笔记和 PPT 作品都会被永久删除。</span></p></div><div class="field">
      <label for="delete-account-password">当前密码</label>
      <input class="input" id="delete-account-password" type="password" autocomplete="current-password" minlength="8" data-delete-account-password>
      <p class="field-error" data-delete-account-error aria-live="polite"></p>
    </div></div>
    <div class="dialog-actions"><button class="btn" type="button" data-dialog-close>取消</button><button class="btn btn-danger" type="button" data-account-action="delete" disabled>确认永久删除</button></div>
  </dialog>

</body>
</html>
