<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人资料 · 设置 · 老己</title>
  <link rel="stylesheet" href="assets/laoji.css?v=20260812-nav-icons-inline-profile-editor-account-email">
  <script defer src="assets/laoji-navigation.js"></script>
  <script defer src="assets/laoji-state.js"></script>
  <script defer src="assets/laoji.js?v=20260812-profile-editor-account-email"></script>
</head>
<body class="settings-detail-page" data-settings-page="profile">
  <div class="app-shell settings-detail-shell" data-od-id="profile-settings-shell">
    <aside class="side-nav">
      <a class="brand-lockup" href="laoji-settings.html" aria-label="打开个人设置">
        <img class="user-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像" data-user-avatar>
        <span class="brand-name-wrap"><span class="brand-name">老己</span></span>
      </a>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-link" href="laoji-chat.html"><span class="nav-dot"></span><span class="nav-text">对话</span></a>
        <a class="nav-link" href="laoji-library.html"><span class="nav-dot"></span><span class="nav-text">读书</span></a>
        <a class="nav-link" href="laoji-settings.html" aria-current="page"><span class="nav-dot"></span><span class="nav-text">设置</span></a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="topbar-title"><p class="eyebrow">设置</p><h1>个人资料</h1></div>
      <span class="settings-detail-desktop-status" data-profile-save-state aria-live="polite"></span>
    </header>

    <header class="settings-detail-header" data-settings-detail-header>
      <a class="settings-detail-back" href="laoji-settings.html" data-settings-detail-back aria-label="返回设置"><span aria-hidden="true">‹</span><span>设置</span></a>
      <h1>个人资料</h1>
      <span class="settings-detail-status" data-profile-save-state aria-live="polite"></span>
    </header>

    <main class="settings-detail-main">
      <div class="settings-detail-content">
        <section class="settings-detail-section profile-settings-section" data-profile-settings-group data-od-id="profile-settings-section" aria-labelledby="profile-section-title">
          <div class="settings-detail-section-heading">
            <h2 id="profile-section-title">头像与昵称</h2>
          </div>

          <div class="avatar-editor" data-od-id="avatar-editor">
            <button class="profile-avatar-button" type="button" data-avatar-trigger data-od-id="upload-avatar-button" aria-label="更换头像">
              <img class="avatar-preview" src="assets/laoji-default-avatar.png" alt="当前头像" data-profile-avatar-preview>
              <span class="profile-avatar-edit-badge" data-avatar-edit-badge aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path fill="currentColor" d="M8.6 4.5a2 2 0 0 1 1.6-.8h3.6a2 2 0 0 1 1.6.8l1.1 1.5H18a3 3 0 0 1 3 3v7.5a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h1.5l1.1-1.5ZM12 8.2a4.3 4.3 0 1 0 0 8.6 4.3 4.3 0 0 0 0-8.6Zm0 2a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6Z"/></svg>
              </span>
            </button>
            <button class="profile-avatar-reset" type="button" data-avatar-reset data-od-id="reset-avatar-button">恢复默认头像</button>
            <input class="avatar-input" id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp" data-avatar-input>
            <p class="field-error" data-avatar-error aria-live="polite"></p>
          </div>

          <form class="settings-detail-form" data-profile-form data-od-id="profile-form">
            <div class="settings-field-row">
              <label for="profile-name">昵称</label>
              <input class="input" id="profile-name" name="name" autocomplete="nickname" maxlength="24">
              <p class="field-error" data-profile-name-error aria-live="polite"></p>
            </div>
            <button class="btn btn-primary settings-detail-primary" type="submit" data-profile-name-save disabled>保存昵称</button>
          </form>
        </section>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="手机主导航">
      <a class="bottom-link" href="laoji-chat.html">对话</a>
      <a class="bottom-link" href="laoji-library.html">读书</a>
      <a class="bottom-link" href="laoji-settings.html" aria-current="page">设置</a>
    </nav>
  </div>

</body>
</html>
