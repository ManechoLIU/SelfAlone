<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信读书 · 设置 · 老己</title>
  <link rel="stylesheet" href="assets/laoji.css?v=20260812-nav-icons-inline-settings-detail-system">
  <script defer src="assets/laoji-navigation.js"></script>
  <script defer src="assets/laoji-state.js"></script>
  <script defer src="assets/laoji.js?v=20260812-settings-detail-system"></script>
</head>
<body class="settings-detail-page" data-settings-page="weread">
  <div class="app-shell settings-detail-shell" data-od-id="weread-settings-shell">
    <aside class="side-nav">
      <a class="brand-lockup" href="laoji-settings.html" aria-label="打开个人设置"><img class="user-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像" data-user-avatar><span class="brand-name-wrap"><span class="brand-name">老己</span></span></a>
      <nav class="nav-list" aria-label="主导航"><a class="nav-link" href="laoji-chat.html"><span class="nav-dot"></span><span class="nav-text">对话</span></a><a class="nav-link" href="laoji-library.html"><span class="nav-dot"></span><span class="nav-text">读书</span></a><a class="nav-link" href="laoji-settings.html" aria-current="page"><span class="nav-dot"></span><span class="nav-text">设置</span></a></nav>
    </aside>

    <header class="topbar" data-od-id="weread-settings-header"><div class="topbar-title"><p class="eyebrow">设置</p><h1 data-od-id="weread-settings-heading">微信读书</h1></div><span class="ai-status" data-connection-top-status="weread">未配置</span><div class="top-actions"><a class="btn" href="laoji-settings.html" data-setup-cancel>取消并返回</a></div></header>
    <header class="settings-detail-header" data-settings-detail-header>
      <a class="settings-detail-back" href="laoji-settings.html" data-settings-detail-back aria-label="返回设置"><span aria-hidden="true">‹</span><span>设置</span></a>
      <h1>微信读书</h1>
      <span class="settings-detail-status" data-connection-top-status="weread" aria-live="polite">未配置</span>
    </header>

    <main class="settings-detail-main">
      <div class="settings-detail-content">
        <section class="settings-detail-section settings-connection-intro" aria-labelledby="weread-connection-title">
          <div class="settings-detail-section-heading"><h2 id="weread-connection-title">同步微信读书</h2><p>连接后可以同步书架、阅读进度和笔记；已有内容不会因断开连接而删除。</p></div>
        </section>
        <section class="settings-detail-section settings-section" data-od-id="weread-settings-form">
          <form class="settings-detail-form" data-setup-form="weread" data-connection-form data-return-to="laoji-settings.html">
            <div class="settings-field-row"><label for="skill-key">微信读书密钥</label><input class="input data" id="skill-key" type="password" autocomplete="off" placeholder="输入密钥" data-secret-key><p class="field-help">密钥只用于读取你授权的微信读书数据。</p><p class="field-error" data-key-error aria-live="polite"></p></div>
            <button class="btn btn-primary settings-detail-primary" type="submit" data-od-id="connect-weread-button">连接微信读书</button>
          </form>
          <div class="settings-detail-actions" data-connection-summary hidden><button class="btn btn-primary" type="button" data-connection-edit>更换密钥</button><button class="btn btn-ghost danger-copy" type="button" data-connection-revoke data-dialog-open="weread-revoke-dialog">断开连接</button></div>
          <div class="settings-detail-recovery" data-connection-invalid hidden><div class="inline-state error"><div><strong>连接已失效</strong><p data-connection-invalid-reason>请重新连接微信读书。</p></div></div><button class="btn btn-primary" type="button" data-connection-retry>重新连接</button></div>
        </section>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="手机主导航"><a class="bottom-link" href="laoji-chat.html">对话</a><a class="bottom-link" href="laoji-library.html">读书</a><a class="bottom-link" href="laoji-settings.html" aria-current="page">设置</a></nav>
  </div>
  <dialog id="weread-revoke-dialog" class="settings-task-dialog" data-od-id="weread-revoke-dialog" aria-labelledby="weread-revoke-title"><div class="dialog-head"><h2 id="weread-revoke-title" tabindex="-1">断开微信读书？</h2></div><div class="dialog-body"><p>断开后将不再获取新的书架、进度和笔记，已有内容仍可查看。</p></div><div class="dialog-actions"><button class="btn btn-ghost" type="button" data-dialog-close>取消</button><button class="btn btn-danger" type="button" data-connection-revoke-confirm>断开连接</button></div></dialog>
</body>
</html>
