<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>习惯系统分享 · 确认 PPT 范围 · 老己</title>
  <script src="assets/laoji-navigation.js?v=20260814-unified-shell-r3"></script>
  <link rel="stylesheet" href="assets/laoji.css?v=20260814-unified-shell-r3">
  <style>
    [data-ppt-workbench="materials"] .scope-confirm-form { padding-top: 0; }
  </style>
  <script defer src="assets/laoji-state.js?v=20260814-unified-shell-r3"></script>
  <script defer src="assets/laoji.js?v=20260814-unified-shell-r3"></script>
</head>
<body class="ppt-conversation-page mobile-conversation-page" data-ppt-conversation-id="ppt-conversation-atomic-habits">
  <div class="app-shell" data-od-id="ppt-materials-shell">
    <aside class="side-nav"><a class="brand-lockup" href="laoji-settings.html" aria-label="打开个人设置"><img class="user-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像"><span class="brand-name-wrap"><span class="brand-name">老己</span></span></a><nav id="ppt-primary-nav" class="nav-list" aria-label="主导航" data-od-id="materials-ppt-primary-nav"><a class="nav-link" href="laoji-chat.html" aria-current="page"><span class="nav-dot"></span><span class="nav-text">对话</span></a><a class="nav-link" href="laoji-library.html"><span class="nav-dot"></span><span class="nav-text">读书</span></a><a class="nav-link" href="laoji-settings.html"><span class="nav-dot"></span><span class="nav-text">设置</span></a></nav><div class="side-foot">会话草稿自动保存</div></aside>
    <header class="topbar mobile-conversation-header" data-mobile-conversation-header data-od-id="materials-header"><a class="mobile-conversation-back mobile-only mobile-keep" href="laoji-chat.html" aria-label="返回会话列表">返回</a><div class="topbar-title"><h1 data-od-id="materials-heading">习惯系统分享</h1><p class="topbar-sub">原子习惯 · 确认范围</p></div><a class="ai-status" href="laoji-ai-setup.html">AI 未配置 · 去配置</a><button class="btn btn-quiet ppt-session-toggle" type="button" data-ppt-session-toggle aria-expanded="false" aria-controls="ppt-session-panel" aria-label="展开会话列表" title="展开会话列表" data-od-id="materials-ppt-session-toggle"></button></header>

    <main class="chat-layout ppt-materials-layout ppt-continuous-shell" data-ppt-chat-shell data-ppt-desktop-shell data-session-mode="collapsed" data-ppt-workbench="materials" data-mobile-view="artifact" data-od-id="ppt-materials-conversation">
      <aside id="ppt-session-panel" class="chat-sessions" data-ppt-session-panel aria-label="PPT 会话列表" data-od-id="materials-ppt-session-panel"><div class="ppt-session-panel-head"><div><p class="eyebrow">当前模块</p><h2>对话</h2></div><button class="icon-btn ppt-session-close" type="button" data-ppt-session-close aria-label="收起会话列表" title="收起会话列表" data-od-id="materials-session-close"></button></div><button class="btn btn-primary chat-new" type="button" data-od-id="materials-new-chat">新建对话</button><div class="chat-session-list"><button class="chat-session is-active" type="button" aria-current="page" data-od-id="materials-current-session"><strong>习惯系统分享</strong><span>当前 · 确认 PPT 范围</span></button><a class="chat-session" href="laoji-chat.html"><strong>最近读书整理</strong><span>普通对话</span></a></div></aside>

      <section class="chat-main" data-ppt-chat-pane aria-label="PPT 对话" data-od-id="materials-ppt-chat-pane">
        <div class="chat-feed" data-chat-feed data-ppt-conversation-timeline aria-live="polite" data-od-id="materials-ppt-conversation-timeline"><div class="chat-thread">
          <div class="thread-date" aria-label="今天">今天</div>
          <div class="message-row user"><span class="message-mark">你</span><div class="message-bubble" data-selected-book-confirmation><p>使用《原子习惯》制作读书分享 PPT。</p><div class="ppt-selected-book-inline"><img src="assets/covers/atomic-habits-image2.png" alt=""><span><strong>原子习惯</strong><small>詹姆斯·克利尔</small></span><small class="ppt-selected-status">已选择</small></div></div></div>
          <div class="message-row assistant"><span class="message-mark"><img src="assets/laoji-default-avatar.png" alt="老己"></span><div class="message-bubble"><p>书籍已锁定。下一步确认内容范围和分享方式，我会据此生成可编辑大纲。</p></div></div>
          <section class="ppt-stage-card" data-ppt-stage-card data-ppt-stage="scope" aria-labelledby="materials-stage-title">
            <div class="ppt-stage-card-copy"><p class="eyebrow">当前步骤 · 待确认</p><h2 id="materials-stage-title">确认 PPT 范围</h2><p>《原子习惯》 · 整本书 · 标准 8 页</p></div>
            <button class="btn btn-primary" type="button" data-ppt-view="artifact" aria-expanded="false">继续确认范围</button>
          </section>
        </div></div>
        <div class="chat-composer-wrap"><form class="chat-composer mobile-chat-composer" data-ppt-inline-form><textarea class="textarea chat-input" rows="1" aria-label="补充要求" placeholder="补充内容重点或分享要求…" data-ppt-inline-input></textarea><button class="btn btn-primary conversation-send-icon" type="submit" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>发送</span></button></form></div>
      </section>

      <aside class="chat-scope-workbench ppt-artifact-canvas ppt-workbench-panel" data-ppt-scope-workbench data-ppt-workbench-panel aria-labelledby="materials-scope-title" data-od-id="materials-ppt-workbench-panel">
        <header class="scope-workbench-head">
          <button class="btn btn-ghost artifact-mobile-back" type="button" data-ppt-view="chat" aria-label="返回当前对话">返回</button>
          <div><h2 id="materials-scope-title">确认 PPT 范围</h2></div>
          <button class="btn btn-ghost ppt-workbench-toggle" type="button" data-ppt-workbench-toggle aria-expanded="true" aria-label="收起作品工作台" data-od-id="materials-ppt-workbench-toggle">收起</button>
        </header>
        <div class="scope-workbench-body">
          <form class="scope-confirm-form" data-material-form data-scope-confirm-form data-outline-direct-navigation data-od-id="generation-requirements">
            <fieldset class="scope-confirm-group"><legend>内容范围</legend><div class="scope-choice-grid" data-ppt-choice-group data-draft-field="scope"><button class="scope-choice is-selected" type="button" aria-pressed="true" data-choice-value="whole-book">整本书</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="chapters">指定章节</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="laoji-notes">已有老己笔记</button></div></fieldset>
            <label class="scope-inline-toggle"><input type="checkbox" data-friend-opinion><span><strong>加入书友观点</strong><small>引用时保留作者与来源</small></span></label>
            <fieldset class="scope-confirm-group"><legend>用途</legend><div class="scope-choice-grid scope-choice-grid-compact" data-ppt-choice-group data-draft-field="purpose"><button class="scope-choice is-selected" type="button" aria-pressed="true" data-choice-value="读书分享">读书分享</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="知识讲解">知识讲解</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="内部培训">内部培训</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="个人复盘">个人复盘</button></div></fieldset>
            <fieldset class="scope-confirm-group"><legend>分享对象</legend><div class="scope-choice-grid scope-choice-grid-compact" data-ppt-choice-group data-draft-field="audience"><button class="scope-choice is-selected" type="button" aria-pressed="true" data-choice-value="同事">同事</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="读书会">读书会</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="学生">学生</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="其他">其他</button></div></fieldset>
            <fieldset class="scope-confirm-group"><legend>页数</legend><div class="scope-choice-grid scope-choice-grid-compact" data-ppt-choice-group data-draft-field="pageCount"><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="5">精简 · 5 页</button><button class="scope-choice is-selected" type="button" aria-pressed="true" data-choice-value="8">标准 · 8 页</button><button class="scope-choice" type="button" aria-pressed="false" data-choice-value="12">详细 · 12 页</button></div></fieldset>
            <button class="btn btn-primary scope-confirm-submit" type="submit" data-generate-outline aria-label="确认范围并生成大纲" data-od-id="generate-outline-button">生成大纲</button>
            <noscript><a class="btn btn-primary scope-confirm-submit" href="laoji-ppt-outline.html?conversation=ppt-conversation-atomic-habits" data-generate-outline data-od-id="generate-outline-no-script">无脚本进入大纲</a></noscript>
          </form>
        </div>
      </aside>
    </main>
    <nav class="bottom-nav"><a class="bottom-link" href="laoji-chat.html" aria-current="page">对话</a><a class="bottom-link" href="laoji-library.html">读书</a><a class="bottom-link" href="laoji-settings.html">设置</a></nav>
  </div>
</body>
</html>
