<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 老己</title>
  <link rel="stylesheet" href="assets/laoji.css">
  <link rel="stylesheet" href="assets/laoji-auth-ink.css">
  <script defer src="assets/laoji-navigation.js"></script>
  <script defer src="assets/laoji.js"></script>
</head>
<body class="auth-ink-page">
  <main class="auth-shell auth-ink-shell" data-od-id="login-screen">
    <aside class="auth-aside" data-od-id="login-brand-panel">
      <a class="auth-brand" href="laoji-login.html" aria-label="老己登录">
        <img class="auth-ink-avatar" src="assets/laoji-default-avatar.png" alt="老己古风女孩头像" data-od-id="login-brand-avatar">
        <span class="auth-brand-name">老己</span>
      </a>
      <div class="auth-ink-window" aria-hidden="true" data-od-id="login-ink-window"><span class="auth-ink-sun"></span><span class="auth-ink-mist"></span></div>
      <div class="auth-aside-copy">
        <p class="eyebrow">阅读 · 整理 · 表达</p>
        <h1 data-od-id="login-brand-statement">阅见本心，言遇世界</h1>
        <p>让每一次阅读沉淀为见识，让每一次思考都有回响。</p>
      </div>
      <p class="auth-ink-mobile-motto">阅见本心<br>言遇世界</p>
      <div class="auth-ink-signature" aria-hidden="true">一卷一世界 · 一念一回响</div>
    </aside>
    <section class="auth-main" data-od-id="login-form-region">
      <div class="auth-card">
        <header class="auth-card-head"><p class="eyebrow">账户</p><h1>欢迎回来</h1><p>使用邮箱和密码继续。</p></header>
        <form class="form-grid" data-auth-form="login" novalidate>
          <div class="field">
            <label for="login-email">邮箱</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" data-auth-field="email" required>
            <p class="field-error" data-auth-error="email" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="login-password">密码</label>
            <div class="password-wrap"><input class="input" id="login-password" name="password" type="password" autocomplete="current-password" data-auth-field="password" required><button class="password-toggle" type="button" data-toggle-password="login-password" data-password-icon data-password-label="密码" aria-label="显示密码" aria-pressed="false" data-od-id="login-password-toggle"><svg class="password-icon password-icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle></svg><svg class="password-icon password-icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18"></path><path d="M10.6 6.15A10.5 10.5 0 0 1 12 6c6 0 9.5 6 9.5 6a14 14 0 0 1-2.15 2.72"></path><path d="M6.55 6.55C3.92 8.2 2.5 12 2.5 12S6 18 12 18c1.42 0 2.7-.34 3.82-.84"></path><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path></svg></button></div>
            <p class="field-error" data-auth-error="password" aria-live="polite"></p>
          </div>
          <div class="auth-options"><label class="check-control"><input type="checkbox" name="remember">保持登录</label><a class="text-link" href="laoji-reset-password.html?mode=request">忘记密码</a></div>
          <p class="field-error" data-auth-error="form" aria-live="polite"></p>
          <button class="btn btn-primary auth-submit" type="submit" data-auth-submit data-od-id="login-button">登录</button>
        </form>
        <p class="auth-switch">还没有账户？<a class="text-link" href="laoji-register.html">注册</a></p>
      </div>
    </section>
  </main>
</body>
</html>
