<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录邮箱 · 账户与安全 · 老己</title>
  <link rel="stylesheet" href="assets/laoji.css?v=20260812-nav-icons-inline-profile-editor-account-email">
  <script defer src="assets/laoji-navigation.js"></script>
  <script defer src="assets/laoji-state.js"></script>
  <script defer src="assets/laoji.js?v=20260812-profile-editor-account-email"></script>
</head>
<body class="settings-detail-page" data-settings-page="account-email">
  <div class="app-shell settings-detail-shell" data-od-id="account-email-settings-shell">
    <aside class="side-nav">
      <a class="brand-lockup" href="laoji-settings.html" aria-label="打开个人设置">
        <img class="user-avatar" src="assets/laoji-default-avatar.png" alt="老己用户的头像" data-user-avatar>
        <span class="brand-name-wrap"><span class="brand-name">老己</span></span>
      </a>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-link" href="laoji-chat.html"><span class="nav-dot"></span><span class="nav-text">对话</span></a>
        <a class="nav-link" href="laoji-library.html"><span class="nav-dot"></span><span class="nav-text">读书</span></a>
        <a class="nav-link" href="laoji-settings.html" aria-current="page"><span class="nav-dot"></span><span class="nav-text">设置</span></a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="topbar-title"><p class="eyebrow">账户与安全</p><h1>登录邮箱</h1></div>
    </header>

    <header class="settings-detail-header" data-settings-detail-header>
      <a class="settings-detail-back" href="laoji-settings.html" data-settings-detail-back aria-label="返回设置"><span aria-hidden="true">‹</span><span>设置</span></a>
      <h1>登录邮箱</h1>
      <span class="settings-detail-status" aria-hidden="true"></span>
    </header>

    <main class="settings-detail-main">
      <div class="settings-detail-content">
        <section class="settings-detail-section" aria-labelledby="account-email-title" data-od-id="account-email-settings-section">
          <div class="settings-detail-section-heading">
            <h2 id="account-email-title">登录邮箱</h2>
            <p>用于登录账户和接收安全验证信息。</p>
          </div>
          <div class="profile-email-account settings-action-row" data-profile-email-account data-od-id="profile-email-account">
            <div class="profile-email-copy">
              <span class="profile-email-label">当前邮箱</span>
              <strong data-profile-email-value>you@example.com</strong>
            </div>
            <button class="btn btn-ghost" type="button" data-dialog-open="change-email-dialog" data-od-id="change-email-button">修改邮箱</button>
          </div>
        </section>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="手机主导航">
      <a class="bottom-link" href="laoji-chat.html">对话</a>
      <a class="bottom-link" href="laoji-library.html">读书</a>
      <a class="bottom-link" href="laoji-settings.html" aria-current="page">设置</a>
    </nav>
  </div>

  <dialog id="change-email-dialog" class="settings-task-dialog" data-change-email-dialog data-od-id="change-email-dialog" aria-labelledby="change-email-dialog-title">
    <div class="dialog-head"><h2 id="change-email-dialog-title" tabindex="-1">修改登录邮箱</h2><button class="btn btn-ghost icon-btn" type="button" aria-label="关闭" data-dialog-close>×</button></div>
    <div class="dialog-body">
      <section data-email-step="current" aria-labelledby="current-email-step-title">
        <p class="email-step-meta">第 1 步，共 2 步</p>
        <h3 id="current-email-step-title">验证当前邮箱</h3>
        <p class="email-step-copy muted">验证码将发送至 <strong data-change-current-email>you@example.com</strong></p>
        <div class="email-code-row">
          <div class="field"><label for="current-email-code">验证码</label><input class="input" id="current-email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-current-email-code></div>
          <button class="btn" type="button" data-send-current-email-code>发送验证码</button>
        </div>
        <p class="field-error" data-current-email-code-error aria-live="polite"></p>
      </section>
      <section data-email-step="new" aria-labelledby="new-email-step-title" hidden>
        <p class="email-step-meta">第 2 步，共 2 步</p>
        <h3 id="new-email-step-title">验证新邮箱</h3>
        <div class="field"><label for="new-login-email">新邮箱</label><input class="input" id="new-login-email" type="email" autocomplete="email" data-new-email></div>
        <div class="email-code-row">
          <div class="field"><label for="new-email-code">验证码</label><input class="input" id="new-email-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-new-email-code></div>
          <button class="btn" type="button" data-send-new-email-code>发送验证码</button>
        </div>
        <p class="field-error" data-new-email-error aria-live="polite"></p>
      </section>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-dialog-close>取消</button>
      <button class="btn" type="button" data-email-back hidden>上一步</button>
      <button class="btn btn-primary" type="button" data-email-next>下一步</button>
      <button class="btn btn-primary" type="button" data-email-confirm hidden>确认修改</button>
    </div>
  </dialog>
</body>
</html>
